name: Barbosachat validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run check
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Export iOS bundle
        run: npx expo export --platform ios
      - name: Export Android bundle
        run: npx expo export --platform android
